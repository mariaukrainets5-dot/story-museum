<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Story Museum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: a museum at night. One 16:9 picture stage that fits any screen, Pepys in front of it, his words on a parchment strip below. */
:root {
  --night: #141a2b;        /* museum wall at night */
  --night-2: #1f2840;
  --parchment: #f3e6c4;    /* diary paper */
  --ink: #2b1d10;          /* oak-gall ink */
  --gold: #d9a441;         /* picture frames */
  --ember: #e2552b;        /* the fire */
  --water: #3d8fd1;
  --leaf: #4f8a3c;
  --display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --body: "Andika", "Trebuchet MS", "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--parchment); font-family: var(--body); overflow: hidden; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.app { height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; gap: 10px; background: radial-gradient(120% 80% at 50% 0%, var(--night-2), var(--night)); }
.stagebox { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
.stage { position: relative; width: min(100cqw, calc(100cqh * 16 / 9)); aspect-ratio: 16 / 9; max-width: 100%; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 3px var(--gold), 0 18px 50px rgba(0, 0, 0, .55); background: var(--night-2); }
.scene { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .7s ease; }
.scene.on { opacity: 1; }

/* Pepys: a sprite sheet of 36 talking frames */
.pepys { position: absolute; aspect-ratio: 213 / 440; background-repeat: no-repeat; background-size: 600% 600%; z-index: 3; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .45));
  left: 2.5%; bottom: -2%; height: 80%; transition: left 1.1s cubic-bezier(.5, 0, .3, 1), bottom 1.1s cubic-bezier(.5, 0, .3, 1), height 1.1s cubic-bezier(.5, 0, .3, 1), opacity .4s; }
.pepys.inframe { left: 43.2%; bottom: 32%; height: 50%; }  /* sprite width = 50% × 213/440 × 9/16 ≈ 13.6% → centred */
.pepys.out { opacity: 0; }

/* Caption strip: the words Pepys is saying */
.caption { flex: none; display: flex; gap: 12px; align-items: center; background: var(--parchment); color: var(--ink); border-radius: 12px; padding: 12px 14px; min-height: 92px; box-shadow: inset 0 0 0 2px #c9b07a; }
.caption .who { font-family: var(--display); font-style: italic; font-size: 15px; color: #7a5420; }
.caption .words { flex: 1; min-width: 0; font-size: clamp(17px, 2.3vw, 24px); line-height: 1.4; }
.caption .words b { color: #a3321a; background: rgba(226, 85, 43, .12); border-radius: 4px; padding: 0 3px; }
.caption .ru { display: block; font-size: .72em; color: #6a5a40; margin-top: 4px; }
.caption .btns { display: flex; gap: 8px; flex: none; }
.btn { border: 0; border-radius: 999px; padding: 12px 18px; font-weight: 700; font-size: 17px; background: #e8d5a6; color: var(--ink); box-shadow: 0 3px 0 #b99c5c; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b99c5c; }
.btn.go { background: var(--leaf); color: #fff; box-shadow: 0 3px 0 #2f5a22; }
.btn.go.ready { animation: nudge 1.2s ease-in-out infinite; }
.btn.small { padding: 10px 13px; font-size: 15px; }
.btn.lang[aria-pressed="true"] { background: var(--ink); color: var(--parchment); box-shadow: 0 3px 0 #000; }
@keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

/* Overlays inside the stage */
.layer { position: absolute; inset: 0; z-index: 5; }
.home { display: grid; align-content: end; justify-items: center; padding: 4% 4% 4%; gap: 10px; background: linear-gradient(to top, rgba(10, 13, 24, .85), rgba(10, 13, 24, 0) 30%), linear-gradient(to bottom, rgba(10, 13, 24, .7), rgba(10, 13, 24, 0) 18%); }
.home h1 { position: absolute; top: 2.5%; left: 0; right: 0; font-family: var(--display); font-weight: 400; font-size: clamp(24px, 4.6cqw, 56px); line-height: 1; margin: 0; text-align: center; text-wrap: balance; text-shadow: 0 2px 12px #000; }
.home p { margin: 0; font-size: clamp(15px, 2cqw, 22px); text-align: center; text-shadow: 0 1px 6px #000; }
.home .btn { font-size: clamp(18px, 2.4cqw, 26px); padding: 14px 28px; }
.frame-hit { position: absolute; left: 41%; top: 14%; width: 18%; height: 56%; border: 0; background: transparent; border-radius: 8px; z-index: 6; }
.frame-hit:focus-visible { outline: 3px solid var(--gold); }

.quiz { display: grid; place-items: center; background: rgba(12, 15, 28, .55); backdrop-filter: blur(2px); }
.quiz .card { background: var(--parchment); color: var(--ink); border-radius: 18px; padding: 3% 4%; display: grid; gap: 14px; justify-items: center; max-width: 92%; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); }
.quiz h2 { font-family: var(--display); font-weight: 400; font-size: clamp(18px, min(3.6cqw, 7cqh), 42px); margin: 0; text-align: center; text-wrap: balance; }
.quiz .ru { font-size: clamp(13px, 1.7cqw, 18px); color: #6a5a40; margin-top: -8px; }
.quiz .card { gap: min(14px, 3cqh); max-height: 94%; }
.opts { display: flex; gap: clamp(8px, 2cqw, 22px); justify-content: center; }
.opt { width: clamp(64px, min(17cqw, 30cqh), 180px); aspect-ratio: 1; border-radius: 16px; border: 3px solid #c9b07a; background: #fffaf0; color: var(--ink); display: grid; place-items: center; align-content: center; gap: 4px; padding: 6px; transition: transform .15s; }
.opt .e { font-size: clamp(28px, min(8cqw, 14cqh), 86px); line-height: 1; }
.opt .w { font-size: clamp(12px, min(1.8cqw, 3.4cqh), 19px); font-weight: 700; }
.opt:hover { transform: translateY(-3px); }
.opt.right { border-color: var(--leaf); background: #e6f4dc; animation: pop .5s; }
.opt.wrong { animation: shake .45s; border-color: var(--ember); }
@keyframes pop { 50% { transform: scale(1.12); } }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

/* Fire game */
.game .house { position: absolute; top: 18%; height: 70%; width: 19%; border: 0; background: transparent; padding: 0; }
.game .glow { position: absolute; inset: 10% 6% 20%; border-radius: 30% 30% 8% 8%; background: radial-gradient(closest-side, rgba(255, 120, 30, .55), rgba(255, 120, 30, 0)); opacity: 0; transition: opacity .3s; pointer-events: none; }
.game .flames { position: absolute; left: 0; right: 0; top: 4%; display: flex; justify-content: center; align-items: flex-end; pointer-events: none; }
.game .flames span { font-size: clamp(26px, 6.5cqw, 76px); line-height: 1; animation: flick .5s ease-in-out infinite alternate; transform-origin: 50% 100%; }
.game .flames span:nth-child(2) { animation-delay: .17s; font-size: clamp(32px, 8.5cqw, 96px); }
.game .flames span:nth-child(3) { animation-delay: .31s; }
@keyframes flick { from { transform: scaleY(.88) rotate(-4deg); } to { transform: scaleY(1.1) rotate(4deg); } }
.game .splash { position: absolute; font-size: clamp(26px, 6cqw, 70px); pointer-events: none; animation: splash .6s ease-out forwards; }
@keyframes splash { from { transform: translateY(-60%) scale(.6); opacity: 1; } to { transform: translateY(40%) scale(1.3); opacity: 0; } }
.game .count { position: absolute; right: 2%; top: 3%; background: rgba(20, 26, 43, .8); border: 2px solid var(--gold); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: clamp(14px, 2cqw, 22px); }

/* Timeline */
.timeline { background: linear-gradient(rgba(20, 26, 43, .86), rgba(20, 26, 43, .94)); display: grid; align-content: center; gap: 4%; padding: 3% 4%; }
.timeline h2 { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 4cqw, 46px); margin: 0; text-align: center; }
.line { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); align-items: center; margin-bottom: 3.6em; }
.mark .lab { position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%); width: max-content; max-width: 13cqw; display: grid; justify-items: center; line-height: 1.2; }
.line::before { content: ""; position: absolute; left: 2%; right: 2%; top: 50%; height: 6px; margin-top: -3px; background: var(--gold); border-radius: 3px; }
.mark { position: relative; z-index: 1; display: grid; justify-items: center; text-align: center; font-size: clamp(11px, 1.6cqw, 16px); }
.mark .dot { width: clamp(42px, 8cqw, 84px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: clamp(20px, 4cqw, 40px); background: var(--night-2); border: 3px solid var(--gold); }
.mark.locked { opacity: .55; }
.mark .yr { font-family: var(--display); font-size: 1.35em; color: var(--gold); font-variant-numeric: tabular-nums; }
.gap { position: relative; z-index: 1; justify-self: center; width: clamp(40px, 7.5cqw, 78px); aspect-ratio: 1; border-radius: 50%; border: 3px dashed var(--parchment); background: rgba(243, 230, 196, .08); color: var(--parchment); font-size: clamp(16px, 3cqw, 30px); }
.gap.wrong { animation: shake .45s; border-color: var(--ember); }
.gap.filled { border: 3px solid var(--ember); background: var(--parchment); font-size: clamp(22px, 4cqw, 40px); animation: pop .5s; }
.sticker { justify-self: center; display: flex; align-items: center; gap: 12px; background: var(--parchment); color: var(--ink); border-radius: 14px; padding: 10px 18px; box-shadow: 0 6px 0 #b99c5c; font-weight: 700; font-size: clamp(14px, 2cqw, 20px); }
.sticker .yr { font-family: var(--display); font-size: 1.6em; color: var(--ember); }
.done-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.parents { text-align: center; font-size: clamp(12px, 1.4cqw, 14px); color: #b9b2a0; }

@media (max-aspect-ratio: 4/5) {
  .caption { flex-wrap: wrap; }
  .caption .btns { width: 100%; justify-content: flex-end; }
}
@media (max-height: 520px) {
  .app { padding-block: 6px; gap: 6px; }
  .caption { min-height: 0; padding: 8px 12px; }
  .caption .words { font-size: 16px; }
  .btn { padding: 9px 14px; font-size: 15px; }
}
.rotate { display: none; }
@media (max-aspect-ratio: 4/5) and (max-width: 600px) {
  .rotate:not(.dismissed) { display: grid; position: fixed; inset: 0; z-index: 50; place-items: center; align-content: center; gap: 18px; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); background: var(--night); text-align: center; }
  .rotate .phone { font-size: 72px; animation: turn 2s ease-in-out infinite; }
  .rotate p { font-family: var(--display); font-size: 28px; margin: 0; line-height: 1.15; }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="rotate" id="rotate">
  <div class="phone" aria-hidden="true">📱</div>
  <p>Turn your phone sideways to visit the museum</p>
  <button class="btn" id="rotateOk">Play like this</button>
</div>
<div class="app">
  <div class="stagebox">
    <div class="stage" id="stage">
      <img class="scene" id="sceneA" alt="">
      <img class="scene" id="sceneB" alt="">
      <div class="pepys inframe" id="pepys" role="img" aria-label="Samuel Pepys"></div>

      <div class="layer home" id="home">
        <button class="frame-hit" id="frameHit" aria-label="Wake up the man in the picture"></button>
        <h1>The Story Museum</h1>
        <p id="homeHint">At night the pictures wake up. Tap the man in the golden frame!</p>
        <button class="btn go" id="startBtn">Wake him up ▶</button>
      </div>

      <div class="layer quiz" id="quiz" hidden>
        <div class="card">
          <h2 id="qText"></h2>
          <div class="ru" id="qRu" hidden></div>
          <div class="opts" id="opts"></div>
        </div>
      </div>

      <div class="layer game" id="game" hidden>
        <div class="count" id="fireCount"></div>
      </div>

      <div class="layer timeline" id="timeline" hidden>
        <h2>My History Timeline</h2>
        <div class="sticker" id="sticker"><span class="yr">1666</span><span>The Great Fire of London</span><span aria-hidden="true">🔥</span></div>
        <div class="line" id="line"></div>
        <div class="done-row" id="doneRow" hidden>
          <button class="btn go" id="againBtn">Hear the story again</button>
          <button class="btn" id="museumBtn">Back to the museum</button>
        </div>
        <div class="parents" id="parents"></div>
      </div>
    </div>
  </div>

  <div class="caption" id="caption">
    <div class="words" id="words"><span class="who">The Story Museum · The Great Fire of London, 1666</span></div>
    <div class="btns">
      <button class="btn small" id="againLine" aria-label="Hear it again" hidden>🔁</button>
      <button class="btn small lang" id="ruBtn" aria-pressed="false" title="Show Russian">RU</button>
      <button class="btn go" id="nextBtn" hidden>Next ▶</button>
    </div>
  </div>
</div>

<script>
(() => {
  const SHEET = { cols: 6, rows: 6, loop: 4.5 };

  // The story. **word** = key word. Facts: Pudding Lane bakery, 2 Sept 1666, about four days,
  // houses pulled down as firebreaks, Pepys buried his Parmesan, we know from his diary.
  const STEPS = [
    { id: "a0", scene: "museum", text: "Hello! My name is Samuel Pepys. I lived in London a long, long time ago, in 1666. I wrote everything in my **diary**. Let me tell you my story!", ru: "Привет! Меня зовут Сэмюэл Пепис. Я жил в Лондоне очень давно, в 1666 году. Я записывал всё в свой дневник. Послушай мою историю!" },
    { id: "a1", scene: "bakery", text: "It was night. On Pudding Lane there was a little **bakery**. The baker's oven was still hot, and a tiny **spark** jumped out. The fire began!", ru: "Была ночь. На улице Пудинг-лейн была маленькая пекарня. Печь пекаря ещё не остыла, и из неё выскочила крошечная искра. Начался пожар!",
      q: { id: "q1", text: "Where did the fire start?", ru: "Где начался пожар?", opts: [["🍞", "a bakery", 1], ["🏰", "a castle"], ["⛵", "a ship"]] } },
    { id: "a2", scene: "houses", text: "The houses were made of **wood**, and they were very close together. The **wind** was strong, so the fire jumped from roof to roof.", ru: "Дома были деревянные и стояли очень близко друг к другу. Дул сильный ветер, и огонь перепрыгивал с крыши на крышу.",
      q: { id: "q2", text: "What were the houses made of?", ru: "Из чего были сделаны дома?", opts: [["🪵", "wood", 1], ["🧊", "ice"], ["🥫", "metal"]] } },
    { id: "a3", scene: "river", text: "People were scared. They put their things in **boats** on the River **Thames**. They passed **buckets** of water, but the fire was too big.", ru: "Люди испугались. Они грузили вещи в лодки на реке Темзе. Они передавали друг другу вёдра с водой, но пожар был слишком большой.",
      q: { id: "q3", text: "How did people carry water?", ru: "В чём люди носили воду?", opts: [["🪣", "buckets", 1], ["🚒", "a fire engine"], ["🚿", "a hose"]] } },
    { id: "a4", scene: "cheese", hidePepys: true, text: "And me? I dug a hole in my garden, and I buried my **cheese**! A big, special Parmesan cheese. I did not want it to burn!", ru: "А я? Я выкопал яму в саду и закопал свой сыр! Большой особенный сыр пармезан. Я не хотел, чтобы он сгорел!",
      q: { id: "q4", text: "What did Samuel bury in his garden?", ru: "Что Сэмюэл закопал в саду?", opts: [["🧀", "cheese", 1], ["👑", "a crown"], ["🐶", "a dog"]] } },
    { id: "a5", scene: "gap", text: "The fire burned for **four days**. To stop it, people pulled down some houses. Then the fire had nothing to burn.", ru: "Пожар горел четыре дня. Чтобы его остановить, люди разобрали несколько домов. Тогда огню стало нечего жечь.", game: true },
    { id: "a6", scene: "newlondon", text: "At last the fire went out. London was built again, with **brick** and **stone**. And a new St Paul's Cathedral was built too.", ru: "Наконец пожар погас. Лондон построили заново, из кирпича и камня. И построили новый собор Святого Павла.",
      q: { id: "q5", text: "How do we know about the Great Fire?", ru: "Откуда мы знаем о Великом пожаре?", opts: [["📖", "a diary", 1], ["📺", "TV"], ["📱", "a phone"]] } },
    { id: "a7", scene: "newlondon", text: "We know because people like me wrote it down. Thank you for listening! Put my story on your **timeline**.", ru: "Мы знаем, потому что люди вроде меня всё записали. Спасибо, что послушал! Помести мою историю на свою ленту времени.", end: true },
  ];
  const GAME_LINE = { id: "g0", text: "Now it's your turn! Tap the fires to throw water. Quick, before the fire jumps to the next house!", ru: "Теперь твоя очередь! Нажимай на огонь, чтобы плеснуть воду. Быстрее, пока огонь не перепрыгнул на соседний дом!" };
  const WIN_LINE = { id: "win", text: "Hooray! You saved the street!", ru: "Ура! Ты спас улицу!" };
  const PRAISE = ["ok1", "ok2"];

  const $ = (id) => document.getElementById(id);
  const pepys = $("pepys"), words = $("words"), nextBtn = $("nextBtn"), againLine = $("againLine"), ruBtn = $("ruBtn");
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const SAVE = "story-museum-v1";
  let save = store.get(SAVE, { done: [], runs: [] });
  let showRu = store.get(SAVE + "-ru", false);
  let run = null;

  // ---------- pictures ----------
  pepys.style.backgroundImage = "url(art/s-pepys.webp)";
  ["museum", "bakery", "houses", "river", "cheese", "gap", "newlondon", "street"].forEach((n) => { const i = new Image(); i.src = `art/${n}.webp`; });
  let front = $("sceneA"), back = $("sceneB"), current = "", sceneTok = 0;
  function showScene(name) {
    if (name === current) return;
    current = name;
    const img = back, token = ++sceneTok;
    img.onload = null;
    img.src = `art/${name}.webp`;
    img.alt = name;
    const swap = () => { // a late load of an older picture must not cover the newer one
      if (token !== sceneTok) return;
      img.onload = null;
      img.classList.add("on"); front.classList.remove("on");
      back = front; front = img;
    };
    if (img.complete && img.naturalWidth) swap(); else img.onload = swap;
  }

  // ---------- Pepys talking ----------
  let talking = false, frame = 0, last = 0;
  function setFrame(i) {
    const c = i % SHEET.cols, r = Math.floor(i / SHEET.cols);
    pepys.style.backgroundPosition = `${(c / (SHEET.cols - 1)) * 100}% ${(r / (SHEET.rows - 1)) * 100}%`;
  }
  setFrame(0);
  function tick(t) {
    const step = (SHEET.loop * 1000) / (SHEET.cols * SHEET.rows);
    if (talking && t - last > step) { frame = (frame + 1) % (SHEET.cols * SHEET.rows); setFrame(frame); last = t; }
    if (!talking && frame !== 0 && t - last > step) { frame = (frame + 1) % (SHEET.cols * SHEET.rows); setFrame(frame); last = t; }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ---------- voice ----------
  const voice = new Audio();
  voice.preload = "auto";
  let sayToken = 0;
  function say(id) {
    const token = ++sayToken;
    return new Promise((resolve) => {
      let doneOnce = false;
      const done = (full) => { if (doneOnce) return; doneOnce = true; if (token === sayToken) talking = false; resolve(full); };
      voice.onended = () => done(true);
      voice.onerror = () => done(false);
      voice.src = `art/voice/${id}.mp3`;
      talking = true;
      const p = voice.play();
      if (p && p.catch) p.catch(() => setTimeout(() => done(false), 1500));
    });
  }
  function hush() { sayToken++; voice.onended = null; voice.pause(); talking = false; }

  // little splash sound made in the browser
  let actx = null;
  function splashSound() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const len = actx.sampleRate * .35, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
      const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
      f.type = "bandpass"; f.frequency.value = 1400; f.Q.value = .7; g.gain.value = .55;
      src.buffer = buf; src.connect(f).connect(g).connect(actx.destination); src.start();
    } catch (e) {}
  }

  // ---------- caption ----------
  const md = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  let lastLine = null;
  function caption(line) {
    lastLine = line;
    words.innerHTML = `<span class="who">Samuel Pepys</span><br>${md(line.text)}${showRu && line.ru ? `<span class="ru">${line.ru}</span>` : ""}`;
  }
  function setRu(v) {
    showRu = v; store.set(SAVE + "-ru", v); ruBtn.setAttribute("aria-pressed", String(v));
    if (lastLine) caption(lastLine);
    $("qRu").hidden = !v;
  }
  ruBtn.onclick = () => setRu(!showRu);
  setRu(showRu);

  // ---------- story flow ----------
  let stepIndex = 0, waitNext = null;
  function waitForNext() {
    nextBtn.hidden = false;
    againLine.hidden = false;
    nextBtn.classList.remove("ready");
    return new Promise((res) => { waitNext = res; });
  }
  nextBtn.onclick = () => { if (waitNext) { const r = waitNext; waitNext = null; nextBtn.hidden = true; againLine.hidden = true; r(); } };

  async function tellLine(line) {
    caption(line);
    run.lines++;
    let full = false;
    const playIt = async () => { const f = await say(line.id); if (f) full = true; if (f) nextBtn.classList.add("ready"); };
    againLine.onclick = () => { run.again++; playIt(); };
    const w = waitForNext();
    playIt();
    await w;
    hush();
    if (full) run.full++;
  }

  async function runStory() {
    run = { lines: 0, full: 0, again: 0, q: 0, firstTry: 0, started: Date.now() };
    for (stepIndex = 0; stepIndex < STEPS.length; stepIndex++) {
      const s = STEPS[stepIndex];
      showScene(s.scene);
      pepys.classList.toggle("out", !!s.hidePepys);
      await tellLine(s);
      if (s.q) await quiz(s.q);
      if (s.game) await fireGame();
      if (s.end) return timeline();
    }
  }

  // ---------- questions ----------
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  let praiseTurn = 0;
  function quiz(q) {
    return new Promise((resolve) => {
      run.q++;
      let tries = 0;
      $("qText").textContent = q.text;
      $("qRu").textContent = q.ru;
      $("qRu").hidden = !showRu;
      const box = $("opts");
      box.innerHTML = "";
      for (const [e, w, ok] of shuffle(q.opts)) {
        const b = document.createElement("button");
        b.className = "opt";
        b.innerHTML = `<span class="e" aria-hidden="true">${e}</span><span class="w">${w}</span>`;
        b.setAttribute("aria-label", w);
        b.onclick = async () => {
          if (box.dataset.locked) return;
          tries++;
          if (ok) {
            box.dataset.locked = "1";
            if (tries === 1) run.firstTry++;
            b.classList.add("right");
            await say(PRAISE[praiseTurn++ % 2]);
            delete box.dataset.locked;
            $("quiz").hidden = true;
            resolve();
          } else {
            b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
            say("no1");
          }
        };
        box.appendChild(b);
      }
      $("quiz").hidden = false;
      say(q.id);
      caption({ text: q.text, ru: q.ru });
    });
  }

  // ---------- fire game ----------
  const HOUSE_X = [1, 20.6, 40.4, 60.2, 80];
  function fireGame() {
    return new Promise(async (resolve) => {
      showScene("street");
      pepys.classList.add("out");
      const layer = $("game");
      layer.querySelectorAll(".house,.splash").forEach((n) => n.remove());
      const level = [0, 2, 0, 2, 0], hot = [0, 0, 0, 0, 0];
      const GOAL = 12;
      let doused = 0, sinceSpark = 0;
      const els = HOUSE_X.map((x, i) => {
        const b = document.createElement("button");
        b.className = "house";
        b.style.left = x + "%";
        b.setAttribute("aria-label", `House ${i + 1}`);
        b.innerHTML = `<span class="glow"></span><span class="flames"></span>`;
        b.onclick = (ev) => {
          if (!level[i]) return;
          level[i]--; hot[i] = 0; doused++;
          splashSound();
          const s = document.createElement("span");
          s.className = "splash"; s.textContent = "💧";
          const r = layer.getBoundingClientRect();
          s.style.left = ((ev.clientX || r.left + r.width * (x + 9) / 100) - r.left - 20) + "px";
          s.style.top = ((ev.clientY || r.top + r.height * .4) - r.top - 30) + "px";
          layer.appendChild(s);
          setTimeout(() => s.remove(), 700);
          draw();
        };
        layer.appendChild(b);
        return b;
      });
      function draw() {
        els.forEach((b, i) => {
          b.querySelector(".flames").innerHTML = "<span>🔥</span>".repeat(level[i]);
          b.querySelector(".glow").style.opacity = level[i] ? (.35 + level[i] * .22) : 0;
          b.setAttribute("aria-label", `House ${i + 1}${level[i] ? ", on fire" : ""}`);
        });
        const n = level.reduce((a, b) => a + b, 0);
        $("fireCount").textContent = doused >= GOAL && !n ? "💧 All out!" : `💧 ${Math.min(doused, GOAL)} / ${GOAL}`;
      }
      draw();
      layer.hidden = false;
      nextBtn.hidden = true;
      caption(GAME_LINE);
      say(GAME_LINE.id);
      const started = Date.now();
      let finished = false;
      const timer = setInterval(() => {
        if (finished) return;
        const calm = Date.now() - started < 5000; // give time to listen first
        const total = level.reduce((a, b) => a + b, 0);
        sinceSpark++;
        if (!calm && doused < GOAL && total < 6 && sinceSpark >= 2) { // the wind brings a new spark
          sinceSpark = 0;
          const free = level.map((v, k) => k).filter((k) => !level[k]);
          if (free.length) level[free[Math.floor(Math.random() * free.length)]] = 1;
        }
        for (let i = 0; i < 5; i++) {
          if (!level[i]) continue;
          if (!calm && level[i] < 3 && Math.random() < .22) level[i]++;
          if (level[i] === 3) {
            hot[i] += 1;
            if (hot[i] >= 3) {
              hot[i] = 0;
              const n = [i - 1, i + 1].filter((k) => k >= 0 && k < 5 && !level[k]);
              if (n.length) level[n[Math.floor(Math.random() * n.length)]] = 1;
            }
          }
        }
        draw();
      }, 900);
      const check = setInterval(async () => {
        if (finished || doused < GOAL || level.some((v) => v)) return;
        finished = true;
        clearInterval(timer); clearInterval(check);
        caption(WIN_LINE);
        await say(WIN_LINE.id);
        layer.hidden = true;
        pepys.classList.remove("out");
        resolve();
      }, 250);
    });
  }

  // ---------- timeline ----------
  const MARKS = [ // one gap before 1605, the right one between 1605 and 1838, one between 1854 and today
    { gap: 0 },
    { yr: "1605", name: "The Gunpowder Plot", icon: "🎆" },
    { gap: 1, right: true },
    { yr: "1838", name: "Grace Darling", icon: "⛵" },
    { yr: "1854", name: "Florence Nightingale", icon: "🪔" },
    { gap: 2 },
    { yr: "Today", name: "You!", icon: "🧒", today: true },
  ];
  function timeline() {
    hush();
    $("timeline").hidden = false;
    nextBtn.hidden = true; againLine.hidden = true;
    $("doneRow").hidden = true;
    $("sticker").hidden = false;
    caption({ text: "Where does **1666** go? Tap the right gap on the timeline.", ru: "Куда поставить 1666 год? Нажми на нужное место на ленте времени." });
    const line = $("line");
    line.innerHTML = "";
    for (const m of MARKS) {
      if ("gap" in m) {
        const b = document.createElement("button");
        b.className = "gap"; b.textContent = "?";
        b.setAttribute("aria-label", "Put 1666 here");
        b.onclick = async () => {
          if (line.dataset.done) return;
          if (m.right) {
            line.dataset.done = "1";
            b.classList.add("filled"); b.textContent = "🔥";
            b.insertAdjacentHTML("afterend", "");
            $("sticker").hidden = true;
            if (!save.done.includes("great-fire")) save.done.push("great-fire");
            save.runs.push({ at: new Date().toISOString().slice(0, 10), full: run.full, lines: run.lines, again: run.again, firstTry: run.firstTry, q: run.q, min: Math.round((Date.now() - run.started) / 6000) / 10 });
            store.set(SAVE, save);
            caption({ text: "Yes! **1666** comes after 1605 and before 1838. Long ago, but not the longest!", ru: "Да! 1666 год идёт после 1605 и до 1838. Давно, но не раньше всех!" });
            await say(PRAISE[praiseTurn++ % 2]);
            $("doneRow").hidden = false;
            $("parents").textContent = `For grown-ups: listened to the end ${run.full} of ${run.lines} times · replayed ${run.again} · right first try ${run.firstTry} of ${run.q} · ${save.runs.length} play${save.runs.length > 1 ? "s" : ""} so far`;
          } else {
            b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
            say("no1");
          }
        };
        line.appendChild(b);
      } else {
        const d = document.createElement("div");
        d.className = "mark" + (m.today ? "" : " locked");
        d.innerHTML = `<span class="dot" aria-hidden="true">${m.icon}</span><span class="lab"><span class="yr">${m.yr}</span><span>${m.name}</span></span>`;
        line.appendChild(d);
      }
    }
    delete line.dataset.done;
    $("parents").textContent = "";
  }
  $("againBtn").onclick = () => { $("timeline").hidden = true; begin(true); };
  $("museumBtn").onclick = () => { $("timeline").hidden = true; toMuseum(); };

  // ---------- museum ----------
  function toMuseum() {
    hush();
    showScene("museum");
    pepys.classList.remove("out", "step");
    pepys.classList.add("inframe");
    $("home").hidden = false;
    nextBtn.hidden = true; againLine.hidden = true;
    lastLine = null;
    words.innerHTML = `<span class="who">The Story Museum · The Great Fire of London, 1666</span>`;
    $("startBtn").textContent = save.done.includes("great-fire") ? "Hear the story again ▶" : "Wake him up ▶";
  }
  let busy = false;
  async function begin(skipWalk) {
    if (busy && !skipWalk) return;
    busy = true;
    $("home").hidden = true;
    if (!skipWalk) {
      pepys.classList.remove("inframe");
      pepys.classList.add("step");
      await new Promise((r) => setTimeout(r, 1150));
    } else {
      pepys.classList.remove("inframe", "out");
      pepys.classList.add("step");
    }
    await runStory();
    busy = false;
  }
  $("rotateOk").onclick = () => $("rotate").classList.add("dismissed");
  $("startBtn").onclick = () => begin(false);
  $("frameHit").onclick = () => begin(false);
  toMuseum();

  window.__sm = { STEPS, state: () => ({ stepIndex, current, save }) };
})();
</script>
